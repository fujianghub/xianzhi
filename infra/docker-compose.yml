# dev 基础设施（05 §2）：PG（pgvector 镜像，5433）+ Mailpit（8025 Web / 1025 SMTP）
# 用法：pnpm db:up / pnpm db:down
name: xz-dev

services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: xz-dev-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: xz
      POSTGRES_PASSWORD: xz
      POSTGRES_DB: xz
      TZ: Asia/Shanghai
    ports:
      - '5433:5432'
    volumes:
      - ../data/pg:/var/lib/postgresql/data
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xz -d xz']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: xz-dev-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # 不做客户端反向 DNS：否则每次连接欢迎语延迟约 2.4s（debug/2026-09-23-mailpit-smtp-latency）
      MP_SMTP_DISABLE_RDNS: 1
    ports:
      - '8025:8025'
      - '1025:1025'
