# 生产 Compose（05 §7、T0-028）：xz-app / xz-collab / xz-pg；复用简斋的 Caddy（见 Caddyfile.snippet）。
# 本机验证：docker compose -f infra/docker-compose.prod.yml --env-file <env> up -d --build
name: xianzhi

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: '5'

services:
  xz-pg:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: xz
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD required}
      POSTGRES_DB: xz
      TZ: Asia/Shanghai
    volumes:
      - xz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xz -d xz']
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  xz-app:
    image: ${XZ_IMAGE:-xianzhi:latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file: ${XZ_ENV_FILE:-../.env.prod}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://xz:${PG_PASSWORD}@xz-pg:5432/xz
      API_PORT: 8010
      DATA_DIR: /app/data
    volumes:
      - xz_data:/app/data
    depends_on:
      xz-pg:
        condition: service_healthy
    ports:
      - '${XZ_APP_BIND:-127.0.0.1:18010}:8010'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8010/api/health >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    logging: *logging

  xz-collab:
    image: ${XZ_IMAGE:-xianzhi:latest}
    restart: unless-stopped
    env_file: ${XZ_ENV_FILE:-../.env.prod}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://xz:${PG_PASSWORD}@xz-pg:5432/xz
      COLLAB_PORT: 8011
    command: ['node', 'dist/collab/server.js']
    # 迁移由 xz-app 启动时完成；collab 等 app healthy 再连库（05 §7）。collab 不挂 xz_data
    depends_on:
      xz-app:
        condition: service_healthy
    ports:
      - '${XZ_COLLAB_BIND:-127.0.0.1:18011}:8011'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8011/collab/health >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

volumes:
  xz_pg:
  xz_data:
